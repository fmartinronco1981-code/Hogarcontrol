name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Preparar Capacitor y Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          if [ ! -d android ]; then
            npx cap add android
          fi
          mkdir -p android/app
          cp "google-services (2).json" android/app/google-services.json
          npx cap sync android

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecontrol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
