<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HogarSync — Control Horario, Tareas y Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            landscape: { raw: '(orientation: landscape)' },
          },
        },
      },
    };
  </script>
  <style>
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.75);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(234, 179, 8, 0);
        transform: scale(1.03);
      }
    }
    .chat-alert-glow {
      animation: pulse-glow 1.35s infinite;
    }
    @media (orientation: landscape) and (min-width: 640px) {
      .employee-main-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 1.25rem;
        align-items: start;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased selection:bg-indigo-600 selection:text-white">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    const STORAGE_KEY = 'hogarsync_v2_state';
    const CLOUD_CONFIG_KEY = 'hogarsync_v2_cloud';

    const DEFAULT_STATE = {
      householdCode: 'HOGAR-8421',
      masterPassword: 'admin',
      employees: [
        {
          id: 'emp_maria',
          name: 'María',
          password: '1234',
          dailyHours: 6,
          rates: [
            { rate: 10, startDate: '2026-01-01' }
          ]
        }
      ],
      shifts: [],
      tasks: [],
      messages: [],
      closedMonths: {},
      lastUpdated: Date.now()
    };

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getMonthKey(dateStr) {
      return dateStr ? dateStr.slice(0, 7) : getTodayISO().slice(0, 7);
    }

    function formatTimeHHMM(ms) {
      if (!ms) return '--:--';
      const d = new Date(ms);
      return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDurationHM(totalMinutes) {
      const mins = Math.max(0, Math.floor(totalMinutes));
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${h}h ${String(m).padStart(2, '0')}m`;
    }

    function formatDurationHMS(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getRateForDate(employee, dateStr) {
      if (!employee || !Array.isArray(employee.rates) || employee.rates.length === 0) {
        return 10;
      }
      const sorted = [...employee.rates].sort((a, b) => a.startDate.localeCompare(b.startDate));
      let activeRate = sorted[0].rate;
      for (const r of sorted) {
        if (r.startDate <= dateStr) {
          activeRate = Number(r.rate);
        } else {
          break;
        }
      }
      return Number(activeRate) || 10;
    }

    function seedInitialDemoData(state) {
      if (state.shifts.length > 0 || state.tasks.length > 0 || state.messages.length > 0) {
        return state;
      }
      const today = getTodayISO();
      const d1 = new Date();
      d1.setDate(d1.getDate() - 2);
      const dayMinus2 = d1.toISOString().slice(0, 10);

      const d2 = new Date();
      d2.setDate(d2.getDate() - 1);
      const dayMinus1 = d2.toISOString().slice(0, 10);

      state.shifts = [
        {
          id: 'sh_demo_1',
          employeeId: 'emp_maria',
          date: dayMinus2,
          startTime: new Date(`${dayMinus2}T09:00:00`).getTime(),
          endTime: new Date(`${dayMinus2}T14:30:00`).getTime(),
          minutes: 330,
          rate: 10,
          status: 'confirmed',
          confirmedBy: 'Propietario 1'
        },
        {
          id: 'sh_demo_2',
          employeeId: 'emp_maria',
          date: dayMinus1,
          startTime: new Date(`${dayMinus1}T10:00:00`).getTime(),
          endTime: new Date(`${dayMinus1}T13:45:00`).getTime(),
          minutes: 225,
          rate: 10,
          status: 'pending',
          confirmedBy: null
        }
      ];

      state.tasks = [
        {
          id: 'tk_demo_1',
          employeeId: 'emp_maria',
          date: today,
          title: 'Limpiar cristales del salón y balcón',
          priority: 'alta',
          completed: false
        },
        {
          id: 'tk_demo_2',
          employeeId: 'emp_maria',
          date: today,
          title: 'Organizar armario de ropa de abrigo',
          priority: 'media',
          completed: false
        }
      ];

      state.messages = [
        {
          id: 'msg_demo_1',
          employeeId: 'emp_maria',
          sender: 'Sistema',
          text: `Turno confirmado (${dayMinus2}): 5h 30m — 55,00 €`,
          timestamp: Date.now() - 86400000 * 2,
          isSystem: true
        }
      ];

      return state;
    }

    function loadCloudConfig() {
      try {
        const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
        return raw ? JSON.parse(raw) : { enabled: false, firebaseDbUrl: '' };
      } catch {
        return { enabled: false, firebaseDbUrl: '' };
      }
    }

    function saveCloudConfig(cfg) {
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = seedInitialDemoData(structuredClone(DEFAULT_STATE));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }
        return JSON.parse(raw);
      } catch {
        return seedInitialDemoData(structuredClone(DEFAULT_STATE));
      }
    }

    let cloudConfig = loadCloudConfig();
    let appState = loadLocalState();
    let isSyncingNow = false;

    const urlParams = new URLSearchParams(window.location.search);
    const paramCode = urlParams.get('hogar');
    const paramDb = urlParams.get('db');
    if (paramCode) {
      appState.householdCode = paramCode.trim().toUpperCase();
    }
    if (paramDb) {
      cloudConfig.firebaseDbUrl = decodeURIComponent(paramDb).replace(/\/+$/, '');
      cloudConfig.enabled = true;
      saveCloudConfig(cloudConfig);
    }

    let ui = {
      view: 'landing',
      selectedEmployeeId: appState.employees[0]?.id || null,
      ownerLabel: 'Propietario 1 (Máster)',
      editModeUnlocked: false,
      employeeTab: 'home',
      ownerTab: 'overview',
      calendarMonth: getTodayISO().slice(0, 7),
      selectedCalendarDate: getTodayISO(),
      toast: null,
      unreadChatForEmployee: {},
      lastSeenMessageCount: {},
      modal: null,
      authError: ''
    };

    function showToast(msg, type = 'info') {
      ui.toast = { msg, type };
      render();
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        ui.toast = null;
        render();
      }, 3200);
    }

    function hasActiveInputFocus() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    async function saveState(pushCloud = true) {
      appState.lastUpdated = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      if (pushCloud && cloudConfig.enabled && cloudConfig.firebaseDbUrl) {
        try {
          await pushToFirebase();
        } catch {}
      }
    }

    function getFirebaseEndpoint() {
      const base = cloudConfig.firebaseDbUrl.replace(/\/+$/, '');
      const code = encodeURIComponent(appState.householdCode || 'HOGAR-DEFAULT');
      return `${base}/households/${code}.json`;
    }

    async function pushToFirebase() {
      if (!cloudConfig.enabled || !cloudConfig.firebaseDbUrl) return;
      await fetch(getFirebaseEndpoint(), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(appState)
      });
    }

    async function pullFromFirebase(silent = true) {
      if (!cloudConfig.enabled || !cloudConfig.firebaseDbUrl || isSyncingNow) return;
      isSyncingNow = true;
      try {
        const res = await fetch(`${getFirebaseEndpoint()}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const remote = await res.json();
        if (!remote || typeof remote !== 'object') return;
        if ((remote.lastUpdated || 0) > (appState.lastUpdated || 0)) {
          appState = {
            ...DEFAULT_STATE,
            ...remote,
            employees: Array.isArray(remote.employees) ? remote.employees : DEFAULT_STATE.employees,
            shifts: Array.isArray(remote.shifts) ? remote.shifts : [],
            tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
            messages: Array.isArray(remote.messages) ? remote.messages : [],
            closedMonths: remote.closedMonths && typeof remote.closedMonths === 'object' ? remote.closedMonths : {}
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          detectNewChatMessages();
          if (!hasActiveInputFocus() && !ui.modal) {
            render();
          }
          if (!silent) showToast('Datos sincronizados desde la nube.', 'success');
        }
      } catch {
        if (!silent) showToast('No se pudo conectar con la nube.', 'error');
      } finally {
        isSyncingNow = false;
      }
    }

    function detectNewChatMessages() {
      appState.employees.forEach((emp) => {
        const empMsgs = appState.messages.filter((m) => m.employeeId === emp.id);
        const prevCount = ui.lastSeenMessageCount[emp.id] ?? empMsgs.length;
        if (empMsgs.length > prevCount) {
          const isViewingThisChat =
            (ui.view === 'emp_space' && ui.selectedEmployeeId === emp.id && ui.employeeTab === 'chat') ||
            (ui.view === 'owner_dash' && ui.selectedEmployeeId === emp.id && ui.ownerTab === 'chat');
          if (!isViewingThisChat) {
            ui.unreadChatForEmployee[emp.id] = true;
          } else {
            ui.lastSeenMessageCount[emp.id] = empMsgs.length;
          }
        }
      });
    }

    function markChatRead(empId) {
      const count = appState.messages.filter((m) => m.employeeId === empId).length;
      ui.lastSeenMessageCount[empId] = count;
      ui.unreadChatForEmployee[empId] = false;
    }

    function addSystemMessage(employeeId, text) {
      appState.messages.push({
        id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        employeeId,
        sender: 'Sistema',
        text,
        timestamp: Date.now(),
        isSystem: true
      });
      detectNewChatMessages();
    }

    async function addChatMessage(employeeId, sender, text) {
      const clean = text.trim();
      if (!clean) return;
      appState.messages.push({
        id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        employeeId,
        sender,
        text: clean,
        timestamp: Date.now(),
        isSystem: false
      });
      markChatRead(employeeId);
      await saveState(true);
      render();
    }

    function getActiveShift(employeeId) {
      return appState.shifts.find((s) => s.employeeId === employeeId && s.status === 'active') || null;
    }

    async function clockIn(employeeId) {
      const emp = appState.employees.find((e) => e.id === employeeId);
      if (!emp) return;
      if (getActiveShift(employeeId)) {
        showToast('Ya hay una entrada activa.', 'error');
        return;
      }
      const now = Date.now();
      const today = getTodayISO();
      const shift = {
        id: `sh_${now}_${Math.random().toString(36).slice(2, 6)}`,
        employeeId,
        date: today,
        startTime: now,
        endTime: null,
        minutes: 0,
        rate: getRateForDate(emp, today),
        status: 'active',
        confirmedBy: null
      };
      appState.shifts.push(shift);
      addSystemMessage(
        employeeId,
        `🟢 ENTRADA de ${emp.name} a las ${formatTimeHHMM(now)} (${today}).`
      );
      await saveState(true);
      showToast(`Entrada fichada a las ${formatTimeHHMM(now)}`, 'success');
      render();
    }

    async function executeClockOut(shiftId) {
      const shift = appState.shifts.find((s) => s.id === shiftId);
      if (!shift || shift.status !== 'active') return;
      const emp = appState.employees.find((e) => e.id === shift.employeeId);
      const now = Date.now();
      const elapsedMinutes = Math.max(1, (now - shift.startTime) / 60000);
      shift.endTime = now;
      shift.minutes = elapsedMinutes;
      shift.rate = getRateForDate(emp, shift.date);
      shift.status = 'pending';

      addSystemMessage(
        shift.employeeId,
        `🟠 SALIDA de ${emp ? emp.name : 'Empleada'} a las ${formatTimeHHMM(now)} (${formatDurationHM(elapsedMinutes)}). Pendiente de confirmar por Propietario.`
      );
      ui.modal = null;
      await saveState(true);
      showToast('Salida registrada. Pendiente de confirmación del propietario.', 'info');
      render();
    }

    async function confirmShift(shiftId, customEndTimeMs = null) {
      const shift = appState.shifts.find((s) => s.id === shiftId);
      if (!shift) return;
      const emp = appState.employees.find((e) => e.id === shift.employeeId);
      if (customEndTimeMs && customEndTimeMs > shift.startTime) {
        shift.endTime = customEndTimeMs;
      } else if (!shift.endTime) {
        shift.endTime = Date.now();
      }
      const exactMinutes = Math.max(0, (shift.endTime - shift.startTime) / 60000);
      shift.minutes = exactMinutes;
      shift.rate = getRateForDate(emp, shift.date);
      shift.status = 'confirmed';
      shift.confirmedBy = ui.ownerLabel;

      ui.calendarMonth = getMonthKey(shift.date);
      ui.selectedCalendarDate = shift.date;

      const amount = ((exactMinutes / 60) * shift.rate).toFixed(2).replace('.', ',');
      addSystemMessage(
        shift.employeeId,
        `✅ Turno CONFIRMADO (${shift.date}, salida ${formatTimeHHMM(shift.endTime)}): ${formatDurationHM(exactMinutes)} (${amount} €) sumados al total.`
      );
      ui.modal = null;
      await saveState(true);
      showToast('Turno confirmado y sumado al calendario.', 'success');
      render();
    }

    function getOvertimeAlerts() {
      const alerts = [];
      const now = Date.now();
      appState.shifts.forEach((s) => {
        if (s.status !== 'active') return;
        const emp = appState.employees.find((e) => e.id === s.employeeId);
        if (!emp) return;
        const allowedMs = (Number(emp.dailyHours || 8) + 1) * 3600000;
        const workedMs = now - s.startTime;
        if (workedMs > allowedMs) {
          alerts.push({
            shift: s,
            employee: emp,
            workedMinutes: workedMs / 60000,
            allowedHours: Number(emp.dailyHours || 8)
          });
        }
      });
      return alerts;
    }

    async function toggleTask(taskId) {
      const task = appState.tasks.find((t) => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      await saveState(true);
      render();
    }

    function getMonthSummary(employeeId, monthKey) {
      const emp = appState.employees.find((e) => e.id === employeeId);
      const dayShifts = appState.shifts.filter(
        (s) => s.employeeId === employeeId && getMonthKey(s.date) === monthKey
      );
      let confirmedMinutes = 0;
      let pendingMinutes = 0;
      let confirmedEuros = 0;
      let pendingEuros = 0;

      dayShifts.forEach((s) => {
        const mins = Number(s.minutes || 0);
        const rate = Number(s.rate ?? getRateForDate(emp, s.date));
        const euros = (mins / 60) * rate;
        if (s.status === 'confirmed') {
          confirmedMinutes += mins;
          confirmedEuros += euros;
        } else if (s.status === 'pending') {
          pendingMinutes += mins;
          pendingEuros += euros;
        }
      });

      return {
        confirmedMinutes,
        pendingMinutes,
        confirmedEuros,
        pendingEuros,
        isClosed: Boolean(appState.closedMonths[`${employeeId}_${monthKey}`])
      };
    }

    function getInviteLink(roleHint = 'empleado') {
      const baseUrl = `${window.location.origin}${window.location.pathname}`;
      const params = new URLSearchParams();
      params.set('hogar', appState.householdCode);
      params.set('rol', roleHint);
      if (cloudConfig.enabled && cloudConfig.firebaseDbUrl) {
        params.set('db', encodeURIComponent(cloudConfig.firebaseDbUrl));
      }
      return `${baseUrl}?${params.toString()}`;
    }

    function renderHeader() {
      const alerts = getOvertimeAlerts();
      const canSeeOvertime = ui.view === 'owner_dash' || ui.view === 'owner_auth' || ui.editModeUnlocked;

      return `
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
          <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <button onclick="goLanding()" class="flex items-center gap-2 text-left group">
                <span class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center font-bold text-lg shadow">HS</span>
                <div>
                  <div class="font-bold leading-tight tracking-tight group-hover:text-indigo-300 transition">HogarSync</div>
                  <div class="text-[11px] text-slate-400">
                    Código: <span class="font-mono text-indigo-300">${appState.householdCode}</span>
                    · ${cloudConfig.enabled && cloudConfig.firebaseDbUrl ? '<span class="text-emerald-400">Nube activa</span>' : '<span class="text-amber-300">Modo local</span>'}
                  </div>
                </div>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
              ${
                canSeeOvertime && alerts.length > 0
                  ? `<button onclick="openOvertimeModal('${alerts[0].shift.id}')" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-semibold animate-pulse flex items-center gap-1.5">
                      <span>⚠️ Olvido salida (${alerts.length})</span>
                    </button>`
                  : ''
              }

              <button onclick="openCloudModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700">
                🔗 Enlace / Nube
              </button>

              ${
                ui.view !== 'landing'
                  ? `<button onclick="goLanding()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700">
                      Inicio
                    </button>`
                  : ''
              }
            </div>
          </div>
        </header>
      `;
    }

    function renderLanding() {
      return `
        <div class="max-w-3xl mx-auto w-full px-4 py-10 flex-1 flex flex-col justify-center">
          <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
            <div class="text-center mb-8">
              <span class="inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-semibold mb-2">
                Hogar · <span class="font-mono">${appState.householdCode}</span>
              </span>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">¿Quién va a usar la app?</h1>
              <p class="text-slate-500 text-sm mt-1">Selecciona tu perfil para fichar, revisar tareas, calendario o gestionar el hogar.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <button onclick="selectRole('owner')" class="group p-6 rounded-2xl border-2 border-slate-200 hover:border-indigo-600 bg-slate-50 hover:bg-indigo-50/40 text-left transition flex flex-col justify-between gap-4">
                <div>
                  <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl font-bold mb-4 group-hover:scale-105 transition">
                    P
                  </div>
                  <h2 class="text-xl font-bold text-slate-900">Propietario</h2>
                  <p class="text-sm text-slate-600 mt-1">
                    Acceso Máster y Modo Edición (con contraseña). Gestiona empleadas, tarifas, tareas, confirmaciones y enlaces.
                  </p>
                </div>
                <span class="text-sm font-semibold text-indigo-700">Entrar como Propietario →</span>
              </button>

              <button onclick="selectRole('employee')" class="group p-6 rounded-2xl border-2 border-slate-200 hover:border-emerald-600 bg-slate-50 hover:bg-emerald-50/40 text-left transition flex flex-col justify-between gap-4">
                <div>
                  <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-xl font-bold mb-4 group-hover:scale-105 transition">
                    E
                  </div>
                  <h2 class="text-xl font-bold text-slate-900">Empleado</h2>
                  <p class="text-sm text-slate-600 mt-1">
                    Elige tu nombre, introduce tu contraseña, ficha entrada/salida, consulta tus tareas especiales, calendario y chat.
                  </p>
                </div>
                <span class="text-sm font-semibold text-emerald-700">Entrar como Empleado →</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderOwnerAuth() {
      return `
        <div class="max-w-md mx-auto w-full px-4 py-12 flex-1 flex items-center">
          <form onsubmit="submitOwnerAuth(event)" class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 w-full space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Acceso Propietario / Modo Edición</h2>
            <p class="text-xs text-slate-500">
              La contraseña de Propietario 1 (Máster) y del Modo Edición es la misma (por defecto: <span class="font-mono font-semibold">admin</span>).
            </p>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Identificador en este dispositivo</label>
              <select id="ownerLabelInput" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm bg-white">
                <option value="Propietario 1 (Máster)" ${ui.ownerLabel === 'Propietario 1 (Máster)' ? 'selected' : ''}>Propietario 1 (Máster)</option>
                <option value="Propietario 2" ${ui.ownerLabel === 'Propietario 2' ? 'selected' : ''}>Propietario 2</option>
                <option value="Propietario 3" ${ui.ownerLabel === 'Propietario 3' ? 'selected' : ''}>Propietario 3</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
              <input id="ownerPassInput" type="password" required placeholder="Introduce la contraseña" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            ${ui.authError ? `<p class="text-xs text-red-600 font-medium">${ui.authError}</p>` : ''}

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="goLanding()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">
                Volver
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">
                Entrar
              </button>
            </div>
          </form>
        </div>
      `;
    }

    function renderCalendarPanel(employeeId, isOwner) {
      const emp = appState.employees.find((e) => e.id === employeeId);
      if (!emp) return '';

      const [yearStr, monthStr] = ui.calendarMonth.split('-');
      const year = Number(yearStr);
      const monthIndex = Number(monthStr) - 1;
      const firstDay = new Date(year, monthIndex, 1);
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const startWeekday = (firstDay.getDay() + 6) % 7;
      const summary = getMonthSummary(employeeId, ui.calendarMonth);

      const cells = [];
      for (let i = 0; i < startWeekday; i++) {
        cells.push(`<div class="h-16 sm:h-20 rounded-lg bg-slate-50/60 border border-slate-100"></div>`);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${yearStr}-${monthStr}-${String(day).padStart(2, '0')}`;
        const dayShifts = appState.shifts.filter((s) => s.employeeId === employeeId && s.date === dateStr);
        const isSelected = ui.selectedCalendarDate === dateStr;

        let totalMins = 0;
        let hasActive = false;
        let hasPending = false;
        let hasConfirmed = false;

        dayShifts.forEach((s) => {
          if (s.status === 'active') {
            hasActive = true;
            totalMins += Math.max(0, (Date.now() - s.startTime) / 60000);
          } else if (s.status === 'pending') {
            hasPending = true;
            totalMins += Number(s.minutes || 0);
          } else if (s.status === 'confirmed') {
            hasConfirmed = true;
            totalMins += Number(s.minutes || 0);
          }
        });

        let stateBadge = '';
        if (hasActive) {
          stateBadge = `<span class="inline-block w-2 h-2 rounded-full bg-blue-500" title="En curso"></span>`;
        } else if (hasPending) {
          stateBadge = `<span class="inline-block w-2 h-2 rounded-full bg-amber-500" title="Pendiente de confirmar"></span>`;
        } else if (hasConfirmed) {
          stateBadge = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500" title="Confirmado"></span>`;
        }

        cells.push(`
          <button onclick="selectCalendarDay('${dateStr}')" class="h-16 sm:h-20 rounded-lg border p-1.5 text-left flex flex-col justify-between transition ${
            isSelected
              ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-200'
              : 'border-slate-200 bg-white hover:border-slate-300'
          }">
            <div class="flex items-center justify-between w-full">
              <span class="text-xs font-bold ${isSelected ? 'text-indigo-800' : 'text-slate-700'}">${day}</span>
              ${stateBadge}
            </div>
            <div class="text-[11px] font-semibold leading-tight ${totalMins > 0 ? 'text-slate-800' : 'text-slate-300'}">
              ${totalMins > 0 ? formatDurationHM(totalMins) : '—'}
            </div>
          </button>
        `);
      }

      const selectedDayShifts = appState.shifts.filter(
        (s) => s.employeeId === employeeId && s.date === ui.selectedCalendarDate
      );

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-2">
                <button onclick="changeCalendarMonth(-1)" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-bold">‹</button>
                <h3 class="text-base sm:text-lg font-bold text-slate-900 capitalize">
                  ${new Date(year, monthIndex, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                </h3>
                <button onclick="changeCalendarMonth(1)" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-bold">›</button>
              </div>

              <div class="flex items-center gap-3 text-xs">
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> En curso</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Pendiente</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Confirmado</span>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-5">
              <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200">
                <div class="text-[11px] font-semibold text-emerald-800 uppercase">Horas confirmadas</div>
                <div class="text-lg font-extrabold text-emerald-950 mt-0.5">${formatDurationHM(summary.confirmedMinutes)}</div>
                <div class="text-sm font-bold text-emerald-700 mt-0.5">${summary.confirmedEuros.toFixed(2).replace('.', ',')} €</div>
              </div>

              <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200">
                <div class="text-[11px] font-semibold text-amber-800 uppercase">Pendientes confirmar</div>
                <div class="text-lg font-extrabold text-amber-950 mt-0.5">${formatDurationHM(summary.pendingMinutes)}</div>
                <div class="text-xs font-semibold text-amber-700 mt-0.5">(${summary.pendingEuros.toFixed(2).replace('.', ',')} € sin sumar)</div>
              </div>

              <div class="p-3.5 rounded-xl bg-slate-900 text-white flex flex-col justify-between">
                <div>
                  <div class="text-[11px] font-semibold text-slate-300 uppercase">Cierre del mes</div>
                  <div class="text-sm font-bold mt-1">
                    ${summary.isClosed ? `<span class="text-emerald-400">✓ Cerrado (${summary.isClosed})</span>` : '<span class="text-amber-300">Abierto</span>'}
                  </div>
                </div>
                ${
                  isOwner
                    ? `<button onclick="toggleCloseMonth('${employeeId}', '${ui.calendarMonth}')" class="mt-2 w-full py-1.5 rounded-lg text-xs font-bold ${
                        summary.isClosed ? 'bg-slate-700 hover:bg-slate-600 text-white' : 'bg-indigo-500 hover:bg-indigo-400 text-white'
                      }">
                        ${summary.isClosed ? 'Reabrir mes' : 'Marcar cierre de mes'}
                      </button>`
                    : ''
                }
              </div>
            </div>

            <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold text-slate-400 mb-1.5">
              <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${cells.join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
            <h4 class="font-bold text-slate-900 mb-3">Detalle del día: <span class="font-mono text-indigo-700">${ui.selectedCalendarDate}</span></h4>
            ${
              selectedDayShifts.length === 0
                ? `<p class="text-sm text-slate-400">No hay turnos registrados en esta fecha.</p>`
                : `<div class="space-y-2.5">
                    ${selectedDayShifts
                      .map((s) => {
                        const mins =
                          s.status === 'active'
                            ? Math.max(0, (Date.now() - s.startTime) / 60000)
                            : Number(s.minutes || 0);
                        const euros = ((mins / 60) * Number(s.rate || 10)).toFixed(2).replace('.', ',');
                        const badgeMap = {
                          active: ['bg-blue-100 text-blue-800', 'En curso'],
                          pending: ['bg-amber-100 text-amber-800', 'Pendiente confirmar'],
                          confirmed: ['bg-emerald-100 text-emerald-800', 'Confirmado']
                        };
                        const [bClass, bLabel] = badgeMap[s.status] || ['bg-slate-100 text-slate-700', s.status];

                        return `
                          <div class="p-3 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-2">
                            <div>
                              <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-slate-800">${formatTimeHHMM(s.startTime)} – ${s.endTime ? formatTimeHHMM(s.endTime) : 'Ahora'}</span>
                                <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${bClass}">${bLabel}</span>
                              </div>
                              <div class="text-xs text-slate-500 mt-0.5">
                                Tiempo: <strong>${formatDurationHM(mins)}</strong> · Tarifa: ${Number(s.rate || 10).toFixed(2).replace('.', ',')} €/h · Importe: <strong>${euros} €</strong>
                              </div>
                            </div>

                            ${
                              isOwner
                                ? `<div class="flex items-center gap-2">
                                    ${
                                      s.status !== 'confirmed'
                                        ? `<button onclick="confirmShift('${s.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">
                                            Confirmar turno
                                          </button>`
                                        : ''
                                    }
                                    <button onclick="openAdjustShiftModal('${s.id}')" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold">
                                      Ajustar / Editar
                                    </button>
                                  </div>`
                                : ''
                            }
                          </div>
                        `;
                      })
                      .join('')}
                  </div>`
            }
          </div>
        </div>
      `;
    }

    function renderChatPanel(employeeId, senderName) {
      const msgs = appState.messages.filter((m) => m.employeeId === employeeId);
      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[460px]">
          <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-slate-900 text-sm">Chat sincronizado</h3>
              <p class="text-[11px] text-slate-500">Avisos automáticos de entrada/salida/confirmación y mensajes del grupo</p>
            </div>
          </div>

          <div id="chatMessagesBox" class="flex-1 overflow-y-auto p-4 space-y-2.5 bg-slate-50/60">
            ${
              msgs.length === 0
                ? `<p class="text-center text-xs text-slate-400 py-8">Aún no hay mensajes en este chat.</p>`
                : msgs
                    .map((m) => {
                      if (m.isSystem) {
                        return `
                          <div class="text-center">
                            <span class="inline-block px-3 py-1 rounded-full bg-slate-200/80 text-slate-700 text-xs font-medium">
                              ${m.text} <span class="text-[10px] text-slate-500 ml-1">${formatTimeHHMM(m.timestamp)}</span>
                            </span>
                          </div>
                        `;
                      }
                      const isMine = m.sender === senderName;
                      return `
                        <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
                          <span class="text-[10px] font-semibold text-slate-500 px-1 mb-0.5">${m.sender} · ${formatTimeHHMM(m.timestamp)}</span>
                          <div class="max-w-[82%] px-3.5 py-2 rounded-2xl text-sm ${
                            isMine
                              ? 'bg-indigo-600 text-white rounded-br-sm'
                              : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'
                          }">
                            ${m.text}
                          </div>
                        </div>
                      `;
                    })
                    .join('')
            }
          </div>

          <form onsubmit="submitChatMessage(event, '${employeeId}', '${senderName}')" class="p-3 border-t border-slate-200 flex gap-2 bg-white rounded-b-2xl">
            <input id="chatInputField" type="text" required placeholder="Escribe un mensaje..." class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">
              Enviar
            </button>
          </form>
        </div>
      `;
    }

    function renderEmployeeSpace() {
      const emp = appState.employees.find((e) => e.id === ui.selectedEmployeeId) || appState.employees[0];
      if (!emp) return renderEmployeeSelect();
      ui.selectedEmployeeId = emp.id;

      const activeShift = getActiveShift(emp.id);
      const today = getTodayISO();
      const todayTasks = appState.tasks.filter((t) => t.employeeId === emp.id && t.date === today);
      const todayShifts = appState.shifts.filter((s) => s.employeeId === emp.id && s.date === today);
      const hasUnreadChat = Boolean(ui.unreadChatForEmployee[emp.id]);

      const priorityBadge = {
        alta: 'bg-red-100 text-red-700 border-red-200',
        media: 'bg-amber-100 text-amber-800 border-amber-200',
        baja: 'bg-slate-100 text-slate-600 border-slate-200'
      };

      return `
        <div class="max-w-5xl mx-auto w-full px-4 py-5 flex-1">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <span class="text-xs font-semibold text-emerald-700">Espacio de Empleado</span>
              <h1 class="text-2xl font-extrabold text-slate-900">${emp.name}</h1>
            </div>

            <div class="flex items-center gap-2 bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
              <button onclick="setEmployeeTab('home')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                ui.employeeTab === 'home' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
              }">
                Fichar y Tareas
              </button>
              <button onclick="setEmployeeTab('calendar')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                ui.employeeTab === 'calendar' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'
              }">
                Calendario
              </button>
              <button onclick="setEmployeeTab('chat')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition relative ${
                ui.employeeTab === 'chat'
                  ? 'bg-emerald-600 text-white'
                  : hasUnreadChat
                  ? 'bg-amber-300 text-slate-950 chat-alert-glow'
                  : 'text-slate-600 hover:bg-slate-100'
              }">
                Chat ${hasUnreadChat ? '●' : ''}
              </button>
            </div>
          </div>

          ${
            ui.employeeTab === 'home'
              ? `
                <div class="employee-main-grid space-y-5 landscape:space-y-0">
                  <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Control de jornada</span>
                      <span class="text-xs font-semibold text-slate-500">Hoy · ${today}</span>
                    </div>

                    <div class="p-4 rounded-2xl bg-slate-900 text-white text-center">
                      <div class="text-xs text-slate-400 mb-1">
                        ${activeShift ? `Entrada a las ${formatTimeHHMM(activeShift.startTime)}` : 'Sin entrada activa'}
                      </div>
                      <div id="liveChronoDisplay" class="text-3xl sm:text-4xl font-mono font-extrabold tracking-tight text-emerald-400">
                        ${activeShift ? formatDurationHMS(Date.now() - activeShift.startTime) : '00:00:00'}
                      </div>
                      <div id="liveChronoHM" class="text-xs font-semibold text-slate-300 mt-1">
                        ${activeShift ? formatDurationHM((Date.now() - activeShift.startTime) / 60000) : '0h 00m'}
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                      <button
                        onclick="clockIn('${emp.id}')"
                        ${activeShift ? 'disabled' : ''}
                        class="py-3.5 px-4 rounded-xl font-bold text-sm transition ${
                          activeShift
                            ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                            : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow'
                        }"
                      >
                        Fichar Entrada
                      </button>

                      <button
                        onclick="requestClockOutConfirm('${activeShift ? activeShift.id : ''}')"
                        ${!activeShift ? 'disabled' : ''}
                        class="py-3.5 px-4 rounded-xl font-bold text-sm transition ${
                          !activeShift
                            ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                            : 'bg-rose-600 hover:bg-rose-700 text-white shadow'
                        }"
                      >
                        Fichar Salida
                      </button>
                    </div>

                    <div class="pt-2 border-t border-slate-100">
                      <div class="text-xs font-bold text-slate-600 mb-2">Turnos de hoy</div>
                      ${
                        todayShifts.length === 0
                          ? `<p class="text-xs text-slate-400">Aún no has fichado hoy.</p>`
                          : `<div class="space-y-1.5">
                              ${todayShifts
                                .map((s) => {
                                  const m =
                                    s.status === 'active'
                                      ? Math.max(0, (Date.now() - s.startTime) / 60000)
                                      : Number(s.minutes || 0);
                                  const statusTxt =
                                    s.status === 'active'
                                      ? 'En curso'
                                      : s.status === 'confirmed'
                                      ? 'Confirmado'
                                      : 'Pendiente confirmar';
                                  return `
                                    <div class="flex items-center justify-between text-xs bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                                      <span>${formatTimeHHMM(s.startTime)} – ${s.endTime ? formatTimeHHMM(s.endTime) : '...'} (<strong>${formatDurationHM(m)}</strong>)</span>
                                      <span class="font-semibold text-slate-600">${statusTxt}</span>
                                    </div>
                                  `;
                                })
                                .join('')}
                            </div>`
                      }
                    </div>
                  </div>

                  <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                      <div>
                        <h2 class="text-base font-bold text-slate-900">Tareas especiales de hoy</h2>
                        <p class="text-xs text-slate-500">Marca opcionalmente las tareas que vayas completando.</p>
                      </div>
                      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">
                        ${todayTasks.filter((t) => t.completed).length}/${todayTasks.length}
                      </span>
                    </div>

                    ${
                      todayTasks.length === 0
                        ? `<div class="p-6 text-center rounded-xl bg-slate-50 border border-dashed border-slate-200 text-xs text-slate-400">
                            No hay tareas especiales asignadas para hoy.
                          </div>`
                        : `<div class="space-y-2.5">
                            ${todayTasks
                              .map((t) => {
                                const pCls = priorityBadge[t.priority] || priorityBadge.media;
                                return `
                                  <label class="flex items-start gap-3 p-3 rounded-xl border ${
                                    t.completed ? 'bg-slate-50 border-slate-200 opacity-75' : 'bg-white border-slate-200 hover:border-indigo-300'
                                  } cursor-pointer transition">
                                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')" class="mt-1 w-4 h-4 rounded accent-emerald-600 cursor-pointer" />
                                    <div class="flex-1 min-w-0">
                                      <div class="flex items-center justify-between gap-2">
                                        <span class="text-sm font-semibold ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${t.title}</span>
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase border ${pCls}">${t.priority}</span>
                                      </div>
                                    </div>
                                  </label>
                                `;
                              })
                              .join('')}
                          </div>`
                    }
                  </div>
                </div>
              `
              : ui.employeeTab === 'calendar'
              ? renderCalendarPanel(emp.id, false)
              : renderChatPanel(emp.id, emp.name)
          }
        </div>
      `;
    }

    function renderOwnerDashboard() {
      const emp = appState.employees.find((e) => e.id === ui.selectedEmployeeId) || appState.employees[0];
      if (emp) ui.selectedEmployeeId = emp.id;

      const pendingShifts = appState.shifts.filter((s) => s.status === 'pending');
      const overtimeAlerts = getOvertimeAlerts();
      const today = getTodayISO();

      return `

                      : `<div class="space-y-3">
                          ${pendingShifts
                            .map((s) => {

                                      Entrada ${formatTimeHHMM(s.startTime)} — Salida ${formatTimeHHMM(s.endTime)} · Duración: <strong>${formatDurationHM(mins)}</strong> · Importe: <strong>${euros} €</strong>
                                    </div>
                                  </div>
                                  <div class="flex items-center gap-2">
                                    <button onclick="confirmShift('${s.id}')" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow">

                                    <button onclick="openAdjustShiftModal('${s.id}')" class="px-3 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold">

                                  </div>
                                </div>
                              `;
                            })
                            .join('')}
                        </div>`
                  }
                </div>
              `
              : ui.ownerTab === 'employees'
              ? `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre (código por defecto)</label>
                      <input id="newEmpName" type="text" required placeholder="Ej. Lucía" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />

                    ${appState.employees
                      .map((e) => {
                        const currentRate = getRateForDate(e, today);
                        return `
                          <div class="p-3.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                            <div>
                              <div class="font-bold text-slate-900">${e.name} <span class="text-xs font-mono text-slate-400">(${e.name})</span></div>

                                appState.employees.length > 1

              : ui.ownerTab === 'tasks'
              ? `

                    <h2 class="text-base font-bold text-slate-900">Asignar tarea especial para ${emp ? emp.name : ''}</h2>
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha</label>
                      <input id="taskDateInput" type="date" value="${today}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />

                      <label class="block text-xs font-semibold text-slate-700 mb-1">Tarea especial</label>

                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">Prioridad</label>
                      <select id="taskPriorityInput" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white">

                        <option value="media" selected>Media</option>

                      </select>

                    <h2 class="text-base font-bold text-slate-900">Tareas de ${emp ? emp.name : ''}</h2>
                    ${
                      emp
                        ? appState.tasks
                            .filter((t) => t.employeeId === emp.id)
                            .sort((a, b) => b.date.localeCompare(a.date))
                            .map(
                              (t) => `
                              <div class="p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2">

                                  <div class="text-xs font-mono text-slate-500">${t.date} · <span class="uppercase font-bold">${t.priority}</span></div>

    function renderModal() {
      if (!ui.modal) return '';

      if (ui.modal.type === 'confirm_checkout') {
        const shift = appState.shifts.find((s) => s.id === ui.modal.shiftId);
        if (!shift) return '';
        const elapsed = formatDurationHM((Date.now() - shift.startTime) / 60000);
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
              <h3 class="text-lg font-extrabold text-slate-900">¿Confirmar fichar salida?</h3>
              <p class="text-sm text-slate-600">
                Se detendrá el contador actual (<strong>${elapsed}</strong>) y se enviará el aviso de salida al chat.
              </p>
              <div class="flex gap-2 pt-2">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold">
                  Cancelar
                </button>
                <button onclick="executeClockOut('${shift.id}')" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold">
                  Sí, fichar salida
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (ui.modal.type === 'adjust_shift') {
        const shift = appState.shifts.find((s) => s.id === ui.modal.shiftId);
        if (!shift) return '';
        const startDateObj = new Date(shift.startTime);
        const endDateObj = new Date(shift.endTime || Date.now());
        const pad = (n) => String(n).padStart(2, '0');
        const toLocalInput = (d) =>
          `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
            <form onsubmit="submitAdjustShift(event, '${shift.id}')" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
              <h3 class="text-lg font-extrabold text-slate-900">Ajustar turno y confirmar</h3>
              <p class="text-xs text-slate-500">Corrige la hora real de entrada o salida y confirma para sumar al cálculo mensual.</p>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Hora de entrada</label>
                <input id="adjStartInput" type="datetime-local" value="${toLocalInput(startDateObj)}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Hora real de salida</label>
                <input id="adjEndInput" type="datetime-local" value="${toLocalInput(endDateObj)}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>

              <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold">
                  Cancelar
                </button>
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold">
                  Guardar y confirmar
                </button>
              </div>
            </form>
          </div>
        `;
      }

      if (ui.modal.type === 'edit_employee') {
        const emp = appState.employees.find((e) => e.id === ui.modal.empId);
        if (!emp) return '';
        const today = getTodayISO();
        const currentRate = getRateForDate(emp, today);

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
            <form onsubmit="submitEditEmployee(event, '${emp.id}')" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-3.5">
              <h3 class="text-lg font-extrabold text-slate-900">Editar empleada</h3>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre</label>
                <input id="editEmpName" type="text" value="${emp.name}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
                <input id="editEmpPass" type="text" value="${emp.password}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Horas diarias de referencia</label>
                <input id="editEmpHours" type="number" step="0.5" min="0.5" value="${emp.dailyHours}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>

              <div class="p-3 rounded-xl bg-indigo-50/70 border border-indigo-100 space-y-2.5">
                <div class="text-xs font-bold text-indigo-900">Cambio de tarifa por hora</div>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nueva tarifa (€/h)</label>
                    <input id="editEmpRate" type="number" step="0.01" min="0" value="${currentRate}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Aplicar desde fecha</label>
                    <input id="editEmpRateStart" type="date" value="${today}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white" />
                  </div>
                </div>
              </div>

              <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold">
                  Cancelar
                </button>
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold">
                  Guardar cambios
                </button>
              </div>
            </form>
          </div>
        `;
      }

      if (ui.modal.type === 'cloud_modal') {
        const empLink = getInviteLink('empleado');
        const ownerLink = getInviteLink('propietario');

        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
            <form onsubmit="submitCloudConfig(event)" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-extrabold text-slate-900">Enlace de hogar y sincronización en nube</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Código de hogar compartido</label>
                <input id="cloudCodeInput" type="text" value="${appState.householdCode}" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-mono uppercase" />
              </div>

              <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                <label class="flex items-center gap-2 text-xs font-bold text-slate-800 cursor-pointer">
                  <input id="cloudEnabledInput" type="checkbox" ${cloudConfig.enabled ? 'checked' : ''} class="w-4 h-4 accent-indigo-600" />
                  Activar sincronización en nube (Firebase Realtime Database)
                </label>
                <input
                  id="cloudUrlInput"
                  type="url"
                  value="${cloudConfig.firebaseDbUrl || ''}"
                  placeholder="https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app"
                  class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono bg-white"
                />
                <p class="text-[11px] text-slate-500">
                  Si se deja desactivado, funciona en local en este navegador. Con la URL de Firebase se sincroniza entre varios móviles.
                </p>
              </div>

              <div class="space-y-2">
                <div class="text-xs font-bold text-slate-700">Enlaces rápidos para otros dispositivos</div>
                <div class="p-2.5 rounded-xl bg-indigo-50 border border-indigo-100">
                  <div class="text-[11px] font-semibold text-indigo-900 mb-1">Enlace Propietario 2, 3...</div>
                  <div class="flex items-center gap-2">
                    <input type="text" readonly value="${ownerLink}" class="flex-1 text-[11px] font-mono bg-white border border-indigo-200 rounded-lg px-2 py-1.5" />
                    <button type="button" onclick="copyText('${ownerLink}')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Copiar</button>
                  </div>
                </div>

                <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-100">
                  <div class="text-[11px] font-semibold text-emerald-900 mb-1">Enlace Empleado</div>
                  <div class="flex items-center gap-2">
                    <input type="text" readonly value="${empLink}" class="flex-1 text-[11px] font-mono bg-white border border-emerald-200 rounded-lg px-2 py-1.5" />
                    <button type="button" onclick="copyText('${empLink}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">Copiar</button>
                  </div>
                </div>
              </div>

              <div class="flex gap-2 pt-2">
                <button type="button" onclick="pullFromFirebase(false)" class="px-3 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">
                  Sincronizar ahora
                </button>
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold">
                  Guardar configuración
                </button>
              </div>
            </form>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const root = document.getElementById('app');
      let bodyHtml = '';

      if (ui.view === 'landing') bodyHtml = renderLanding();
      else if (ui.view === 'owner_auth') bodyHtml = renderOwnerAuth();
      else if (ui.view === 'owner_dash') bodyHtml = renderOwnerDashboard();
      else if (ui.view === 'emp_select') bodyHtml = renderEmployeeSelect();
      else if (ui.view === 'emp_auth') bodyHtml = renderEmployeeAuth();
      else if (ui.view === 'emp_space') bodyHtml = renderEmployeeSpace();

      const toastHtml = ui.toast
        ? `<div class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-bold text-white ${
            ui.toast.type === 'error' ? 'bg-red-600' : ui.toast.type === 'success' ? 'bg-emerald-600' : 'bg-slate-900'
          }">${ui.toast.msg}</div>`
        : '';

      root.innerHTML = `
        ${renderHeader()}
        ${bodyHtml}
        ${renderModal()}
        ${toastHtml}
      `;
    }

    window.goLanding = () => {
      ui.view = 'landing';
      ui.authError = '';
      render();
    };

    window.selectRole = (role) => {
      ui.authError = '';
      if (role === 'owner') {
        ui.view = ui.editModeUnlocked ? 'owner_dash' : 'owner_auth';
      } else {
        ui.view = 'emp_select';
      }
      render();
    };

    window.submitOwnerAuth = (e) => {
      e.preventDefault();
      const pass = document.getElementById('ownerPassInput').value;
      const label = document.getElementById('ownerLabelInput').value;
      if (pass === appState.masterPassword) {
        ui.ownerLabel = label;
        ui.editModeUnlocked = true;
        ui.authError = '';
        ui.view = 'owner_dash';
        render();
      } else {
        ui.authError = 'Contraseña incorrecta.';
        render();
      }
    };

    window.chooseEmployeeForAuth = (empId) => {
      ui.selectedEmployeeId = empId;
      ui.authError = '';
      ui.view = 'emp_auth';
      render();
    };

    window.submitEmployeeAuth = (e) => {
      e.preventDefault();
      const emp = appState.employees.find((x) => x.id === ui.selectedEmployeeId);
      const pass = document.getElementById('empPassInput').value;
      if (emp && pass === emp.password) {
        ui.authError = '';
        ui.employeeTab = 'home';
        ui.view = 'emp_space';
        render();
      } else {
        ui.authError = 'Contraseña incorrecta.';
        render();
      }
    };

    window.setEmployeeTab = (tab) => {
      ui.employeeTab = tab;
      if (tab === 'chat' && ui.selectedEmployeeId) {
        markChatRead(ui.selectedEmployeeId);
      }
      render();
    };

    window.setOwnerTab = (tab) => {
      ui.ownerTab = tab;
      if (tab === 'chat' && ui.selectedEmployeeId) {
        markChatRead(ui.selectedEmployeeId);
      }
      render();
    };

    window.changeSelectedEmployee = (empId) => {
      ui.selectedEmployeeId = empId;
      ui.selectedCalendarDate = getTodayISO();
      render();
    };

    window.clockIn = clockIn;

    window.requestClockOutConfirm = (shiftId) => {
      if (!shiftId) return;
      ui.modal = { type: 'confirm_checkout', shiftId };
      render();
    };

    window.executeClockOut = executeClockOut;
    window.confirmShift = confirmShift;
    window.toggleTask = toggleTask;

    window.closeModal = () => {
      ui.modal = null;
      render();
    };

    window.openAdjustShiftModal = (shiftId) => {
      ui.modal = { type: 'adjust_shift', shiftId };
      render();
    };

    window.openOvertimeModal = (shiftId) => {
      ui.modal = { type: 'adjust_shift', shiftId };
      render();
    };

    window.submitAdjustShift = async (e, shiftId) => {
      e.preventDefault();
      const startVal = new Date(document.getElementById('adjStartInput').value).getTime();
      const endVal = new Date(document.getElementById('adjEndInput').value).getTime();
      if (isNaN(startVal) || isNaN(endVal) || endVal <= startVal) {
        showToast('La hora de salida debe ser posterior a la de entrada.', 'error');
        return;
      }
      const shift = appState.shifts.find((s) => s.id === shiftId);
      if (!shift) return;
      shift.startTime = startVal;
      shift.date = new Date(startVal).toISOString().slice(0, 10);
      await confirmShift(shiftId, endVal);
    };

    window.changeCalendarMonth = (delta) => {
      const [y, m] = ui.calendarMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      ui.calendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      render();
    };

    window.selectCalendarDay = (dateStr) => {
      ui.selectedCalendarDate = dateStr;
      render();
    };

    window.toggleCloseMonth = async (empId, monthKey) => {
      const key = `${empId}_${monthKey}`;
      if (appState.closedMonths[key]) {
        delete appState.closedMonths[key];
        showToast('Mes reabierto.', 'info');
      } else {
        appState.closedMonths[key] = getTodayISO();
        showToast('Cierre de mes marcado.', 'success');
      }
      await saveState(true);
      render();
    };

    window.submitChatMessage = async (e, empId, senderName) => {
      e.preventDefault();
      const input = document.getElementById('chatInputField');
      if (!input) return;
      const text = input.value;
      input.value = '';
      await addChatMessage(empId, senderName, text);
    };

    window.createEmployee = async (e) => {
      e.preventDefault();
      const name = document.getElementById('newEmpName').value.trim();
      const password = document.getElementById('newEmpPass').value;
      const rate = parseFloat(document.getElementById('newEmpRate').value);
      const dailyHours = parseFloat(document.getElementById('newEmpHours').value);
      if (!name || !password) return;

      const id = `emp_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;
      appState.employees.push({
        id,
        name,
        password,
        dailyHours: isNaN(dailyHours) ? 6 : dailyHours,
        rates: [{ rate: isNaN(rate) ? 10 : rate, startDate: '2026-01-01' }]
      });
      ui.selectedEmployeeId = id;
      await saveState(true);
      showToast(`Empleada "${name}" creada.`, 'success');
      render();
    };

    window.openEditEmployeeModal = (empId) => {
      ui.modal = { type: 'edit_employee', empId };
      render();
    };

    window.submitEditEmployee = async (e, empId) => {
      e.preventDefault();
      const emp = appState.employees.find((x) => x.id === empId);
      if (!emp) return;

      const name = document.getElementById('editEmpName').value.trim();
      const password = document.getElementById('editEmpPass').value;
      const dailyHours = parseFloat(document.getElementById('editEmpHours').value);
      const newRate = parseFloat(document.getElementById('editEmpRate').value);
      const startDate = document.getElementById('editEmpRateStart').value;

      if (name) emp.name = name;
      if (password) emp.password = password;
      if (!isNaN(dailyHours)) emp.dailyHours = dailyHours;

      if (!isNaN(newRate) && startDate) {
        const existingIdx = emp.rates.findIndex((r) => r.startDate === startDate);
        if (existingIdx >= 0) {
          emp.rates[existingIdx].rate = newRate;
        } else {
          emp.rates.push({ rate: newRate, startDate });
        }
        emp.rates.sort((a, b) => a.startDate.localeCompare(b.startDate));
      }

      ui.modal = null;
      await saveState(true);
      showToast('Datos y tarifa actualizados.', 'success');
      render();
    };

    window.deleteEmployee = async (empId) => {
      if (appState.employees.length <= 1) return;
      appState.employees = appState.employees.filter((e) => e.id !== empId);
      if (ui.selectedEmployeeId === empId) {
        ui.selectedEmployeeId = appState.employees[0]?.id || null;
      }
      await saveState(true);
      showToast('Empleada eliminada.', 'info');
      render();
    };

    window.addSpecialTask = async (e) => {
      e.preventDefault();
      const emp = appState.employees.find((x) => x.id === ui.selectedEmployeeId);
      if (!emp) return;
      const date = document.getElementById('taskDateInput').value;
      const title = document.getElementById('taskTitleInput').value.trim();
      const priority = document.getElementById('taskPriorityInput').value;
      if (!date || !title) return;

      appState.tasks.push({
        id: `tk_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
        employeeId: emp.id,
        date,
        title,
        priority,
        completed: false
      });
      await saveState(true);
      showToast('Tarea especial añadida.', 'success');
      render();
    };

    window.deleteTask = async (taskId) => {
      appState.tasks = appState.tasks.filter((t) => t.id !== taskId);
      await saveState(true);
      render();
    };

    window.openCloudModal = () => {
      ui.modal = { type: 'cloud_modal' };
      render();
    };

    window.submitCloudConfig = async (e) => {
      e.preventDefault();
      const code = document.getElementById('cloudCodeInput').value.trim().toUpperCase();
      const enabled = document.getElementById('cloudEnabledInput').checked;
      const url = document.getElementById('cloudUrlInput').value.trim().replace(/\/+$/, '');

      if (code) appState.householdCode = code;
      cloudConfig = { enabled, firebaseDbUrl: url };
      saveCloudConfig(cloudConfig);
      ui.modal = null;
      await saveState(true);
      if (enabled && url) {
        await pullFromFirebase(false);
      }
      showToast('Configuración de enlace y nube guardada.', 'success');
      render();
    };

    window.copyText = (txt) => {
      navigator.clipboard?.writeText(txt).then(
        () => showToast('Enlace copiado al portapapeles.', 'success'),
        () => showToast('Selecciona y copia el enlace manualmente.', 'info')
      );
    };

    setInterval(() => {
      if (ui.view === 'emp_space' && ui.employeeTab === 'home') {
        const emp = appState.employees.find((e) => e.id === ui.selectedEmployeeId);
        const activeShift = emp ? getActiveShift(emp.id) : null;
        const elHMS = document.getElementById('liveChronoDisplay');
        const elHM = document.getElementById('liveChronoHM');
        if (activeShift && elHMS && elHM) {
          const diffMs = Date.now() - activeShift.startTime;
          elHMS.textContent = formatDurationHMS(diffMs);
          elHM.textContent = formatDurationHM(diffMs / 60000);
        }
      }
    }, 1000);

    setInterval(() => {
      if (cloudConfig.enabled && cloudConfig.firebaseDbUrl) {
        pullFromFirebase(true);
      }
    }, 1500);

    render();
    if (cloudConfig.enabled && cloudConfig.firebaseDbUrl) {
      pullFromFirebase(true);
    }
  </script>
</body>
</html>
